# xcodegen spec for the Apple TV companion app.
# Regenerate with: cd apple_tv && xcodegen generate
#
# Same bundle ID as the iOS and macOS apps, so App Store Connect puts its
# builds on the tvOS platform of the one "Radio Crestin" app (Universal
# Purchase), not on a separate TV app.

name: RadioCrestinTV
options:
  bundleIdPrefix: com.radiocrestinsoftware
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: "2KNY2RZVGC"   # Same Apple Developer team as the iOS app
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "3"      # tvOS = 3
    SUPPORTS_MACCATALYST: NO
    ENABLE_BITCODE: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    # 3.56 renamed the config's `apiKey` to `projectToken`, which
    # Analytics.swift uses.
    from: "3.56.0"

targets:
  RadioCrestinTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: RadioCrestinTV/Sources
      - path: RadioCrestinTV/Resources
    dependencies:
      - package: PostHog
        product: PostHog
    info:
      path: RadioCrestinTV/Info.plist
      properties:
        CFBundleDisplayName: Radio Crestin
        CFBundleShortVersionString: "1.5.1"
        CFBundleVersion: "87"
        # No encryption beyond the system's HTTPS, which is exempt, as the
        # iOS app declares: App Store Connect then skips the export
        # compliance question on every uploaded build.
        ITSAppUsesNonExemptEncryption: false
        # The app's UI is Romanian, as in the macOS app. Declaring it makes
        # tvOS run the app in Romanian when the Apple TV's languages put
        # Romanian before English, so the system's strings inside the app
        # (VoiceOver names of SF Symbols, the tab bar, error descriptions)
        # are Romanian too. Other Apple TVs keep the development language,
        # English, as before.
        CFBundleLocalizations:
          - ro
        # The app's own background (#0A0A0A, `Theme.background`) whatever
        # the system appearance: an empty dictionary draws the system
        # background, white in Light appearance, before the dark app.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Radio keeps playing on the Home screen and under the screensaver,
        # and the remote and Control Center can control it there. The
        # `.playback` session category alone does not keep a background
        # app running; without this mode tvOS suspends it and the audio
        # stops. The iOS app declares the same mode.
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          # iOS app already ships with NSAllowsArbitraryLoads=true; tvOS
          # needs the same so http:// Icecast streams play without TLS.
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.radiocrestinsoftware.radioApp
        # The App Icon brand assets also hold the static Top Shelf images.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
      configs:
        # No physical Apple TV is registered on the team, so Apple can't
        # issue a Development profile. Both configs use Manual signing:
        # Debug uses ad-hoc identity ("-") so the simulator build runs
        # locally without requesting any profile. Release uses the App
        # Store Distribution cert + a manually-created App Store profile
        # (the profile is created at developer.apple.com — App Store
        # profiles do NOT need registered devices).
        #
        # Why not Automatic for Release? xcodebuild's pre-archive
        # provisioning sweep tries to fetch BOTH a Development AND a
        # Distribution profile from Apple, and the Development fetch
        # fails (no registered tvOS devices), blocking archive.
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          PROVISIONING_PROFILE_SPECIFIER: ""
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Radio Crestin TV App Store"

  # Unit tests, run on the tvOS simulator only, through their own scheme
  # below. They are deliberately NOT part of the RadioCrestinTV scheme:
  # that scheme stays Release-only so archiving fetches nothing but the
  # App Store profile (see 56d9dcc, which dropped the test target from it
  # because its signing widened that fetch).
  RadioCrestinTVTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: RadioCrestinTVTests
    dependencies:
      - target: RadioCrestinTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.radiocrestinsoftware.radioApp.tests
        GENERATE_INFOPLIST_FILE: YES
      configs:
        # Ad-hoc identity in both configs, like the app's Debug: the bundle
        # only ever runs on the simulator, so it must never ask Apple for a
        # provisioning profile.
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          PROVISIONING_PROFILE_SPECIFIER: ""
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          PROVISIONING_PROFILE_SPECIFIER: ""

schemes:
  RadioCrestinTV:
    build:
      targets:
        RadioCrestinTV: all
    # Force every scheme action (Run, Test, Profile, Analyze, Archive) onto
    # Release config so xcodebuild only ever provisions the App Store profile.
    # Without this, xcodebuild's pre-build provisioning sweep also fetches
    # the Debug/Development profile — which Apple refuses to issue because
    # the team has no registered tvOS devices, blocking archive.
    run:
      config: Release
    test:
      config: Release
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release

  # Test-only scheme, separate so the app scheme above stays Release-only.
  # Tests run in Debug: `@testable import` needs testability, which Release
  # turns off. Run with:
  #   xcodebuild -project RadioCrestinTV.xcodeproj -scheme RadioCrestinTVTests
  #     -destination 'platform=tvOS Simulator,name=<simulator>' test
  RadioCrestinTVTests:
    build:
      targets:
        RadioCrestinTVTests: [test]
    test:
      config: Debug
      targets:
        - RadioCrestinTVTests
